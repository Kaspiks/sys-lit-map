# Logged decisions store the reason *code*: reword a label freely, but never change or reuse a code.

screener: KM  #

seed: 2026  # fixes the random order of the seed set (and later every random sample)
seed_set_size: 100  # records screened in random order before the ranker takes over

stopping_rule:
  irrelevant_in_a_row: 100

# when_missing: the screening page suggests the reason when a record has none of that concept block's terms
exclusion_reasons:
  - {code: not_running, label: "Not running (walking, cycling, other sports)", when_missing: population}
  - {code: no_auditory_pacing, label: "No music or metronome used as pacing", when_missing: exposure}
  - {code: wrong_outcome, label: "Outcome not cadence, step frequency or synchronisation", when_missing: outcome}
  - {code: wrong_population, label: "Clinical population, children or animals"}
  - {code: not_empirical, label: "Review, opinion or protocol"}
  - {code: other, label: "Other", note_required: true}

ranker:
  model: random_forest
  batch_size: 25
  min_labels: {relevant: 5, irrelevant: 5}
  features: [words, concepts, metadata]
  n_estimators: 500
  class_weight: balanced
  tfidf: {ngram_range: [1, 2], min_df: 2}

second_screener:
  sample_size: 150
