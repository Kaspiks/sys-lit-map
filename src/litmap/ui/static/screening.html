<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Screening · litmap</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/screening.js"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Pages"></nav>

    <div class="page">
      <header class="page-header" id="header"></header>

      <main class="screening">
        <section class="stats" id="stats" aria-label="Progress"></section>
        <section class="term-strip" id="term-strip" aria-label="Highlighted terms"></section>
        <div id="banners"></div>

        <div class="workspace">
          <div class="record-column">
            <article class="card record" id="record" aria-live="polite"></article>
            <footer class="actions" id="actions" aria-label="Decision"></footer>
          </div>

          <aside class="side">
            <section class="card panel">
              <h2>Event feed</h2>
              <p class="panel-note">Your decisions and undos, as logged in logs/screening.jsonl</p>
              <ol class="feed" id="feed"></ol>
              <a class="panel-link" href="/trail?tab=events">Open the event log</a>
            </section>

            <section class="card panel">
              <h2>Exclusion reasons</h2>
              <p class="panel-note">Press E, then the reason's number</p>
              <ol class="reason-key" id="reason-key"></ol>
            </section>
          </aside>
        </div>
      </main>
    </div>
  </div>

  <p class="toast" id="toast" role="status" hidden></p>
</body>
</html>
