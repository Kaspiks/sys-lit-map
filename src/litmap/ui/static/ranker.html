<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ranker · litmap</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/ranker.js"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Pages"></nav>

    <div class="page">
      <header class="page-header" id="header"></header>

      <main class="ranker">
        <section class="stats" id="stats" aria-label="Ranker"></section>
        <div id="curve"></div>
        <section class="card panel">
          <h2>Iterations</h2>
          <p class="panel-note">Each iteration is logged with its training labels, settings and the
            screening pool's SHA-256, so it can be rebuilt and compared with its saved ranking.</p>
          <div id="iterations"></div>
        </section>
      </main>
    </div>
  </div>
</body>
</html>
