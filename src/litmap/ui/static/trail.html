<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record trail · litmap</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/trail.js"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">litmap</span>
    <nav>
      <a href="/">Screening</a>
      <a href="/trail" aria-current="page">Record trail</a>
    </nav>
  </header>

  <main class="trail">
    <form class="lookup" id="lookup">
      <input type="search" id="query" name="q"
        placeholder="pubmed:26258007, a DOI or a PMID" aria-label="Record id, DOI or PMID">
      <button type="submit">Show trail</button>
    </form>
    <div class="trail-sections" id="trail"></div>
  </main>
</body>
</html>
