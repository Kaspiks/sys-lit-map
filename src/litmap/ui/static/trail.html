<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Record trail · litmap</title>
  <link rel="stylesheet" href="/static/style.css">
  <script type="module" src="/static/trail.js"></script>
</head>
<body>
  <div class="app">
    <nav class="sidebar" id="sidebar" aria-label="Pages"></nav>

    <div class="page">
      <header class="page-header" id="header"></header>

      <main class="trail">
        <form class="lookup">
          <input type="search" id="query" name="q"
            placeholder="pubmed:26258007, a DOI or a PMID" aria-label="Record id, DOI or PMID">
          <button type="submit">Show trail</button>
        </form>
        <p class="recent-chips" id="recent"></p>
        <section class="metrics" id="metrics" aria-label="The whole review"></section>
        <nav class="tabs" id="tabs" aria-label="Views"></nav>
        <div class="trail-sections" id="panel"></div>
      </main>
    </div>
  </div>
</body>
</html>
